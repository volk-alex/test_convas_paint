<html>
	<head>
		<style>
			html, body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
			}
			body {
				display: flex;
				justyfy-context: center;
				align-items: center;
				background: black;
			}
			canvas {
				width: 100%;
				height: 100%;
				object-fit: contain;
				image-rendering: pixelated;
			}
		</style>
	</head>
	<body>
		<canvas id="game" width="640" height="360"></canvas>
		<script>
			const canvas = document.getElementById("game");
			const ctx = canvas.getContext("2d");
			const rect = canvas.getBoundingClientRect();
			
			ctx.strokeStyle = "red";
			ctx.lineWidth = 5;
			ctx.imageSmoothingEnabled = false;
			//ctx.lineCap = "round";
			
			ctx.beginPath();
			canvas.addEventListener("pointerdown", (event) => {
				let scale, top, left;
				if(canvas.clientWidth/canvas.clientHeight<16/9){
					scale = (canvas.width/canvas.clientWidth);
					left = 0;
					top = (canvas.clientHeight-canvas.height/scale)/2;
				} else {
					scale = (canvas.height/canvas.clientHeight)
					left = (canvas.clientWidth-canvas.width/scale)/2;
					top = 0;
				}
				
				ctx.lineTo((event.clientX-left)*scale, (event.clientY-top)*scale);
				ctx.stroke();
			});
		</script>
	</body>
</html>
